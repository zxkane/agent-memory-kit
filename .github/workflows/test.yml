name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm test

  # The oldest supported Git: Debian 11 ships Git 2.30 in its archive.
  test-git-2-30:
    name: test (Git 2.30)
    runs-on: ubuntu-latest
    container: node:24-bullseye@sha256:25f3016fcdae6b5d65bd9bcb4064b7e4198ec8d49493fa40d73f9b463d04fb15 # 24-bullseye
    steps:
      - run: git --version
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The container runs as root but the checkout belongs to the runner's user.
      # The tests run Git with a private home directory, so a safe.directory
      # setting would not reach them; own the files instead.
      - run: chown -R "$(id -u):$(id -g)" .
      - run: npm test
